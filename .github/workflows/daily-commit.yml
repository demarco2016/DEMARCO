name: Portfolio Health Check

on:
  schedule:
    - cron: '0 10 * * 1'  # Weekly on Monday
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML and assets
        run: |
          echo "Checking portfolio files..."
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f style.css || (echo "Missing style.css" && exit 1)
          test -f script.js || (echo "Missing script.js" && exit 1)
          echo "All core files present."

      - name: Check for common issues
        run: |
          if grep -q "TODO\|FIXME" index.html style.css script.js; then
            echo "Found TODO/FIXME comments - review recommended"
          fi
          echo "Health check passed."
